# Installed by setup.sh into data/nginx/custom/server_proxy.conf. NPM includes
# this file in every generated proxy_host/*.conf (the trailing
# `include /data/nginx/custom/server_proxy[.]conf;` line), so it applies to all
# proxy hosts and survives NPM config regeneration. It is intentionally managed
# from the repo rather than through the NPM admin UI.
#
# Fixes Immich "Unexpected end of stream" on uploads through the reverse proxy
# from external networks. Two independent causes are addressed:
#   1. nginx's default proxy read/send timeout is 60s; a large photo or video
#      over a slow external uplink exceeds it and nginx cuts the stream.
#   2. NPM caps request bodies at 2000m globally; 0 lifts it for large videos.
# (At home the Immich app hits :2283 directly, bypassing nginx, so neither
#  limit applies -- which is why uploads only failed from outside.)
client_max_body_size 0;
proxy_read_timeout   600s;
proxy_send_timeout   600s;
send_timeout         600s;
# Recommended by Immich's reverse-proxy docs: stream uploads straight to the
# backend instead of buffering the whole body in nginx first (avoids OOM on
# large videos, improves upload speed).
proxy_request_buffering off;
