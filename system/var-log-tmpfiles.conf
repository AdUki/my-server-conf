# Managed by my-server-conf/setup.sh (setup_low_write_rootfs).
# /var/log is a tmpfs; recreate at boot the directories that daemons expect
# to exist (they create files but not their parent directories).
d /var/log/samba   0750 root adm  -
d /var/log/cups    0755 root lp   -
d /var/log/apt     0755 root root -
d /var/log/private 0700 root root -
d /var/log/journal 2755 root systemd-journal -
