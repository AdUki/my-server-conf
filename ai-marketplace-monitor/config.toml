#
# AI Marketplace Monitor — config for Simon
# Location: Bratislava, Slovakia
# Goal: smartphones & electronics, AI-judged for (a) extreme underpricing,
#       (b) budget phones with decent specs, (c) LineageOS-flashable phones.
#
# SECRETS: nothing sensitive is written directly into this file. Fill in
# FACEBOOK_USERNAME / FACEBOOK_PASSWORD / GEMINI_API_KEY as environment
# variables before running (see instructions sent separately).
#

#
# AI service used to judge each listing
#
# ---------------------------------------------------------------------
# PRIMARY: Groq. Free tier is ~1,000 requests/day (30/min) on one normal
# account -- enough for the ~800/day target on its own, unlike Google's
# 20/day. It is OpenAI-compatible, so it works here via base_url.
#
# Get a free key (no card) at https://console.groq.com/keys and put it in
# secrets.env as GROQ_API_KEY. Until that key exists this section simply
# fails and evaluation falls through to the Gemini models below.
#
# If the model name below ever 404s, list valid ones with:
#   curl -s https://api.groq.com/openai/v1/models \
#     -H "Authorization: Bearer $GROQ_API_KEY" | grep -o '"id":"[^"]*"'
#
# Cerebras (https://cloud.cerebras.ai) is an equivalent free-tier backup
# with the same ~1,000/day shape; add it the same way with
# base_url = 'https://api.cerebras.ai/v1' if you want more headroom.
# VERIFIED LIVE on this key: x-ratelimit-limit-requests = 1000/day, and
# the two models below report that allowance independently, so chaining
# them roughly doubles headroom. llama-3.3-70b-versatile is NOT available
# on this account (404) -- do not put it back.
#
# qwen3.8-27b is first because in a side-by-side test it actually reasoned
# about street price and wrote a real summary, while gpt-oss-120b copied
# the output template literally ("Rating 4: short summary"). gpt-oss-120b
# is the bigger model and stays as the next fallback.
[ai.groq]
provider = 'openai'
api_key = '${GROQ_API_KEY}'
base_url = 'https://api.groq.com/openai/v1'
model = 'qwen/qwen3.8-27b'
max_retries = 2

[ai.groq_oss]
provider = 'openai'
api_key = '${GROQ_API_KEY}'
base_url = 'https://api.groq.com/openai/v1'
model = 'openai/gpt-oss-120b'
max_retries = 2

# Each Groq model carries its OWN 1000 requests/day, so listing more of them
# multiplies the daily ceiling rather than sharing one pool. Verified per
# model against x-ratelimit-limit-requests. Ordered strongest first.
[ai.groq_oss20]
provider = 'openai'
api_key = '${GROQ_API_KEY}'
base_url = 'https://api.groq.com/openai/v1'
model = 'openai/gpt-oss-20b'
max_retries = 2

[ai.groq_qwen36]
provider = 'openai'
api_key = '${GROQ_API_KEY}'
base_url = 'https://api.groq.com/openai/v1'
model = 'qwen/qwen3.6-27b'
max_retries = 2

# ---------------------------------------------------------------------
# Cerebras: a second free tier with its own ~1000/day allowance, entirely
# separate from Groq's. Added because Groq's per-minute budget is shared
# between listing evaluation AND the device-spec lookups, and when it runs out
# BOTH stop: the spec queue sat at zero resolved per run for days while every
# listing fell back to a model guessing resale values from memory.
#
# OpenAI-compatible, so it needs nothing but a base_url. Get a free key (no
# card) at https://cloud.cerebras.ai and put it in secrets.env as
# CEREBRAS_API_KEY. Until that key exists these two sections simply fail and
# evaluation carries on down the chain, exactly like the Groq ones do.
[ai.cerebras]
provider = 'openai'
api_key = '${CEREBRAS_API_KEY}'
base_url = 'https://api.cerebras.ai/v1'
model = 'gemma-4-31b'
max_retries = 2

[ai.cerebras_qwen]
provider = 'openai'
api_key = '${CEREBRAS_API_KEY}'
base_url = 'https://api.cerebras.ai/v1'
model = 'qwen-3.8-27b'
max_retries = 2

# ---------------------------------------------------------------------
# FALLBACKS: Google Gemini.
# Google's free tier allows only 20 requests PER DAY PER MODEL
# (confirmed from the live 429 body: GenerateRequestsPerDayPerProjectPerModel,
# quotaValue 20). One search cycle can easily exceed that.
#
# Each model has its OWN separate 20/day allowance, and this tool tries its
# AI services in order, falling through to the next one when a service
# errors out. So listing several models chains their quotas: when the first
# is exhausted for the day, evaluation continues on the next.
#
# max_retries is deliberately LOW. A quota-exhausted model can never succeed
# by retrying, and with exponential backoff a high retry count would stall
# each listing for ~10 minutes before falling through to the next model.
# Failing fast is what makes the fallback chain actually work.
#
# Verified live that this key can reach every model listed below;
# *-pro and flash-latest return 429 on this key and are not usable.

[ai.gemini]
api_key = '${GEMINI_API_KEY}'
model = 'gemini-3.6-flash'
max_retries = 2

[ai.gemini_35]
provider = 'gemini'
api_key = '${GEMINI_API_KEY}'
model = 'gemini-3.5-flash'
max_retries = 2

[ai.gemini_35_lite]
provider = 'gemini'
api_key = '${GEMINI_API_KEY}'
model = 'gemini-3.5-flash-lite'
max_retries = 2

[ai.gemini_31_lite]
provider = 'gemini'
api_key = '${GEMINI_API_KEY}'
model = 'gemini-3.1-flash-lite'
max_retries = 2

#
# Marketplace: Facebook, centered on Bratislava
#
[marketplace.facebook]
search_city = 'bratislava'
# Facebook radius for European cities is shown in km in the UI. 50km covers
# greater Bratislava plus nearby towns (Trnava, Senec, Pezinok, Malacky...).
# Widen this if you want to catch deals across more of Slovakia.
radius = 80
currency = 'EUR'
# TESTED LIVE and reverted: deliveryMethod=local_pick_up stacked with the
# other active filters (category, minPrice, condition, brand query) made
# Facebook return ZERO results for every single search, every time -- not
# a subtle bug, directly observed via -v debug logs. Too restrictive to use.
#
# seller_locations is the tool's actual purpose-built fix for "results from
# the wrong place": it's a POST-search filter on each listing's own real
# displayed location text (whatever Facebook shows, e.g. "Fairfield, CA"),
# independent of shipping settings -- so shipping/recommended listings from
# outside Slovakia get dropped without also dropping genuine local supply.
# Location filter, centred on Hviezdoslavov: everything within roughly 30km
# (Podunajsko, Bratislava and its boroughs, the Senec and Šamorín areas).
