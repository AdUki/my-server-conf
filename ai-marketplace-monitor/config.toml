# Deliberately not set here: username/password are picked up straight from
# the FACEBOOK_USERNAME / FACEBOOK_PASSWORD environment variables (loaded by
# run.sh from secrets.env). The web UI's login gate reads config values
# literally (no ${VAR} expansion), so writing '${FACEBOOK_USERNAME}' here
# would make the web UI expect that literal placeholder text as your login.
# CONFIRMED LIVE: login was hitting Facebook's two-step verification (2FA)
# every single run (credentials are correct) with login_wait_time=0, so
# there was never any window for it to complete -- immediate failure,
# every time. Restoring a real wait. If your 2FA is a push-approval ("tap
# Yes on your phone") rather than a typed code, this may work headless as
# long as you approve it on your phone within this window. If it needs a
# typed code, you'll need one interactive run without --headless (or via a
# VNC/X-forwarded display) to enter it — after that, the session is saved
# to disk (~/.ai-marketplace-monitor/facebook_session_state.json) and
# reused on every future run, so this should only be needed once.
login_wait_time = 15

search_interval = '1h'
max_search_interval = '2h'    # jitter between 1h-2h so requests look less robotic and hit FB less often

notify = 'me'
sort_by = 'new'                # catch freshly-listed deals before others snipe them

# This applies to every item searched below. It's where the "AI judgement"
# combinations you described live — the model applies whichever clause fits.
extra_prompt = """
You are hunting for exceptional smartphone and electronics deals for a buyer
in Bratislava, Slovakia.

RULE ZERO - PRICE IS MANDATORY. A listing can only be rated 5 if it is
genuinely, steeply underpriced against its current second-hand market
value. Nothing else can earn a 5 on its own. Good specs, a high quality
score, nice condition, "matches the search", full battery health,
LineageOS support - none of these qualify a listing by themselves. They
only describe a phone the buyer would consider IF the price is already a
steal. If the discount requirement below is not met, the maximum rating is
3, no matter how good the device is.

Judge every listing in this order:

1. REQUIRED DISCOUNT. Estimate the realistic current second-hand resale
   value in Europe for this exact model and condition (not the original
   MSRP, not the new price). Then compute the discount:
       discount = (resale - asking) / resale
   The MINIMUM is 40% off. Below 40% off, the rating cannot exceed 3.
   More expensive items must be discounted harder, because a small
   percentage off a pricey item is still a lot of money:
     - resale under EUR 150   -> at least 40% off
     - EUR 150 to 350         -> at least 45% off
     - EUR 350 to 700         -> at least 50% off
     - over EUR 700           -> at least 55% off
   ALWAYS state the estimated resale value, the asking price and the
   computed discount percentage in your summary, so the buyer can check
   your arithmetic. If you cannot estimate the resale value with
   reasonable confidence, rate 2 and say so - do not guess generously.

2. IS IT WORTH OWNING? Only for listings that already passed step 1.
   A VERIFIED FACTS block is supplied above for most devices with a
   QUALITY x/100 rating computed from the chip benchmark, RAM and
   storage. Use it: at QUALITY below 35 the device is weak, so drop the
   rating to 3 even if the price is good - a cheap bad phone is not a
   deal. Smartphones should also have more than 4GB of RAM. If no facts
   are given, judge conservatively rather than generously.

3. BONUS, NEVER A QUALIFIER. Mention these when present, but they can
   never lift a listing that failed step 1:
     - LineageOS or an active custom-ROM community for that exact model.
     - Unusually good condition, full battery health, accessories.

4. BROKEN / DAMAGED / FOR-PARTS PHONES are wanted, but only at salvage
   pricing: at most 1/5 (20%) of the working-condition resale value, i.e.
   at least 80% off. A cracked, dead-battery or "na nahradne diely" unit
   at a normal used discount is a 1, not a deal.

A listing can qualify on more than one of these — mention all that apply.
SCAM DETECTION -- rate 1 and say "SCAM" in the summary if ANY of these
appear. These are not deals no matter how low the price:
  - The listing points at an external shop or website to buy/order from:
    any URL, domain, "objednaj", "objednávka", "e-shop", "eshop", "our
    store", "nas obchod", "link in bio", "kliknite", "click here",
    "doprava zdarma", "free shipping", "dobierka", "posielame".
  - It asks you to move off Marketplace to arrange payment: WhatsApp,
    Telegram, Viber, Messenger-only, email, phone-only "write me".
  - Payment before pickup: deposit, "zaloha", bank transfer, PayPal
    friends-and-family, crypto, gift cards.
  - The same generic listing is clearly mass-posted (stock photos, no
    real condition detail, an implausible catalogue of many models at one
    flat price).
  - A brand-new, sealed, current-generation flagship at a fraction of
    retail. Real salvage bargains are USED and have a reason for the
    price (cracked, battery, sold quickly); a "new sealed iPhone 17 for
    150 EUR with shipping" is a scam, not clause 1 underpricing.

IMPORTANT distinction: the buyer genuinely does want extremely cheap
items, so cheap alone is NOT suspicious. What marks a scam is cheap
COMBINED with an external shop link, off-platform payment, shipping
instead of local pickup, or a too-perfect brand-new item. A cheap, used,
locally-collected phone from a normal personal seller is exactly what the
buyer wants -- do not reject that as "too good to be true".

DEFAULT TO REJECTING. The buyer is drowning in false positives, so an
ordinary listing at an ordinary price is a 1-2, not a 3-4. Reserve 5 for
listings that clearly and verifiably clear one of the bars above — if you
are unsure, or you cannot confidently estimate the model's resale value,
rate it low rather than guessing generously. "Seems like a reasonable
price" is NOT a deal. Accessories, cases, chargers, cables, parts, broken
units, and non-electronics that merely mention a brand name are never
deals — rate them 1.
"""

#
# Notification: ntfy (no account needed)
#
[user.me]
# Via env var: this file is committed to a public repo, and anyone who
# knows the topic name can read your alerts (and publish to them).
ntfy_topic = '${NTFY_TOPIC}'
# Cap the listing description in the push. Left unset, the tool sends the
# seller's ENTIRE description, and ntfy turns any message over ~4KB into an
# "attachment.txt" you have to open instead of showing text in the
# notification -- which is exactly what was happening.
#
# 1200 chars keeps the whole message comfortably under ntfy's ~4KB limit
# (title + price + location + URL + AI verdict add roughly 300 more) while
# still showing most real listing descriptions in full.
with_description = 1200
# Force plain text: no markdown, so nothing renders as stray symbols.
message_format = 'plain_text'
remind = '3d'   # nudge again if a good listing is still up after 3 days

#
# Items to search
#
[item.smartphones]
# category='phones' (a subcategory slug, only verified valid on Facebook's
# separate /marketplace/category/phones/ BROWSE page) turned out to break
# city scoping when used as this tool's category= SEARCH query parameter —
# that parameter only recognizes the tool's original top-level categories.
# Back to 'electronics', the one value actually proven scoped-correctly.
# search_phrases are brand names, not generic words like "phone"/"telefon",
# since sellers title listings by brand/model, not generic words.
search_phrases = ['Samsung', 'iPhone', 'Xiaomi', 'Huawei', 'Honor', 'realme']
category = 'electronics'
min_price = 10
# Pre-AI filters. These run BEFORE the AI call, so they cut both junk
# notifications and free-tier quota burn (the AI call is the scarce
# resource). keywords = must match at least one (OR); antikeywords =
# reject if any match.
#
# Brand searches like "Samsung" drag in TVs, monitors, washing machines,
# watches and accessories -- all of which were being sent for AI scoring.
keywords = ['iphone', 'galaxy', 'redmi', 'poco', 'xiaomi', 'huawei', 'honor', 'realme', 'oneplus', 'pixel', 'telefon', 'smartfon', 'mobil']
# These match against title AND description (facebook.py check_listing), as a
# plain substring with no notion of what the listing actually IS. The
# in-the-box accessories were therefore rejecting the phones they came with:
# a genuine "iPhone 15 Plus" was dropped for the words "nabíjačka" and "kábel"
# appearing in its description, which is how most private sellers describe a
# complete phone. Observed repeatedly on real iPhones, Xiaomis and Samsungs.
#
# So: obal/kryt/puzdro/case/nabíjačka/charger/kábel/cable/sklo/fólia/
# klávesnica/myš are GONE. A listing that really is only a case still has to
# clear `keywords` (it needs a model word), and is then rejected by the AI --
# a wasted call, deliberately accepted, because missing a real phone costs
# more than one call from a quota that chains across several models.
#
# What stays: words that name the PRODUCT rather than something in the box
# with it (a phone ad does not say "televízor" or "chladnička"), and the
# scam/off-platform signals, which are the reason this filter runs before the
# AI at all.
antikeywords = ['televízor', 'televizor', 'monitor', 'práčka', 'chladnička', 'hodinky', 'watch', 'buds', 'slúchadlá', 'sluchadla', 'notebook', 'laptop', 'konzola', 'práčky', 'http://', 'https://', 'www.', 'e-shop', 'eshop', 'objednávka', 'objednaj', 'doprava zdarma', 'dobierka', 'telegram', 'viber', 'whatsapp']
description = """
Any Android or iPhone smartphone worth buying: either extremely underpriced
vs its normal second-hand market value, a budget phone with 4GB+ RAM and a
more than 4GB of RAM, or a model known to be well-supported by
LineageOS/custom ROMs. Must be an actual phone -- not a TV, monitor,
watch, case, charger, cable or other accessory. Broken / damaged / sold-
for-parts phones ARE of interest, but only at salvage pricing: at most
1/5 (20%) of the working-condition resale value.
"""
condition = ['new', 'used_like_new', 'used_good']
# Raised 4 -> 5: rating 4 was letting through too much ordinary junk.
# Only genuine, fully-qualifying deals notify now.
rating = 5

[item.electronics]
# Monitors, desktops and consoles were removed: they produced junk alerts
# (a 27" Acer monitor, an old desktop PC, a PS4 at EUR 140) and none of them
# has a benchmark this tool can score, so the AI was judging them on prose
# alone. Laptops and tablets stay - those it can score properly.
search_phrases = ['laptop', 'notebook', 'tablet', 'iPad', 'MacBook']
category = 'electronics'
min_price = 20
antikeywords = ['rozbitý', 'rozbity', 'poškodený', 'poskodeny', 'nefunkčný', 'nefunkcny', 'na náhradné diely', 'broken', 'for parts', 'monitor', 'televízor', 'televizor', 'playstation', 'ps4', 'ps5', 'xbox', 'nintendo', 'konzola', 'stolný', 'stolny', 'desktop', 'počítač', 'pocitac', 'zostava', 'skrinka', 'grafická karta', 'graficka karta', 'základná doska', 'procesor', 'tlačiareň', 'tlaciaren']
description = """
Laptops, tablets, and other consumer electronics (not phones) that are
extremely underpriced against the graduated discount curve in the prompt
above (the more expensive the item, the steeper the discount required —
a flat "half off" is NOT enough for pricier gear). Not interested in
accessories, chargers, cables, spare parts, or broken units.
"""
condition = ['new', 'used_like_new', 'used_good']
# Raised 4 -> 5: rating 4 was letting through too much ordinary junk.
# Only genuine, fully-qualifying deals notify now.
rating = 5

#
# Tumble dryer -- separate item because the criteria are nothing like the
# phone/electronics ones: no specs, no resale-value curve, no AnTuTu.
# Just "is it a dryer and is it <= 30 EUR", broken explicitly welcome.
#
[item.dryer]
# Slovak "susicka" = dryer. Accent-free spellings included because plenty
# of sellers type without diacritics.
search_phrases = ['sušička', 'susicka', 'sušička bielizne', 'sušička prádla']
# Facebook-side price cap, so out-of-budget units never even get fetched.
max_price = 30
# No category set on purpose: 'homegoods' was never verified against this
# tool's category= search parameter, and an unverified category value has
# already broken result scoping once in this config's history.
#
# No condition filter either -- the default would exclude used_fair, which
# is exactly where cheap/broken dryers live.
# Require the word itself somewhere in the title or description. Without
# this, every cheap thing Facebook loosely matched for "susicka" reached the
# AI: a kitchen thermometer, a dress, cutlery, a child's chair and a baby
# carrier all burned tokens from a budget of 8000 per minute, which is the
# same budget the phone searches need. Stems, not whole words, so susicku /
# susicky / susickou all count; both spellings, because matching is
# accent-sensitive. Matched against title AND description, so a dryer listed
# under a vague title still gets through.
keywords = ['sušič', 'susic']
antikeywords = ['sušička na ovocie', 'susicka na ovocie', 'sušička ovocia', 'sušička rúk', 'susicka ruk', 'vlasov', 'filament']
description = """
A clothes tumble dryer (susicka bielizne / susicka pradla) for at most
30 EUR. Working or broken/faulty are both fine at this price. NOT a food
dehydrator, hand dryer, hair dryer or filament dryer.
"""
# Item-level extra_prompt overrides the marketplace-level one, which is all
# about phone resale curves and AnTuTu scores and is irrelevant here.
extra_prompt = """
This item is a simple, single-criterion search. Rate 5 if ALL of the
following hold:
  - it is genuinely a clothes tumble dryer (susicka bielizne / susicka
    pradla / a dryer for laundry), AND
  - the asking price is 30 EUR or less.
Condition does NOT matter: broken, faulty, "nefunkcna", damaged, or sold
for parts all still rate 5 as long as it is a laundry dryer at 30 EUR or
less. The buyer wants cheap units regardless of state.

Rate 1 if it is not a laundry dryer -- in particular a food dehydrator
(susicka na ovocie/potravin), hand dryer, hair dryer, 3D-printer filament
dryer, or a washing machine with no dryer function -- or if the price is
above 30 EUR.
"""
rating = 4
